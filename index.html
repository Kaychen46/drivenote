<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveNote — 個人雲端知識記事本</title>
  <meta name="theme-color" content="#FF7A00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DriveNote">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --bg-canvas: #FFFFFF;
      --ink-main: #1A1D21;
      --ink-muted: #525B66;
      --accent-orange: #FF7A00;
      --accent-orange-hover: #E56C00;
      --accent-sky: #A6D5F7;
      --accent-sky-deep: #1D5B8C;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(26, 29, 33, 0.08);
    }

    html {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      color: var(--ink-main);
      background-color: var(--bg-canvas);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-size: 18px;
      line-height: 1.65;
      background-color: #FFFFFF;
      background-image:
        radial-gradient(circle at 12% 14%, rgba(255, 122, 0, 0.14) 0%, rgba(255, 122, 0, 0) 42%),
        radial-gradient(circle at 88% 18%, rgba(166, 213, 247, 0.34) 0%, rgba(166, 213, 247, 0) 46%),
        radial-gradient(circle at 75% 86%, rgba(255, 122, 0, 0.09) 0%, rgba(255, 122, 0, 0) 42%),
        radial-gradient(circle at 18% 82%, rgba(166, 213, 247, 0.22) 0%, rgba(166, 213, 247, 0) 44%);
      background-attachment: fixed;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(20, 30, 45, 0.05);
    }

    .btn-pill-orange {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      border-radius: 9999px;
      font-weight: 600;
      transition: all 0.18s ease;
    }
    .btn-pill-orange:hover {
      background-color: var(--accent-orange-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(255, 122, 0, 0.28);
    }

    .btn-pill-soft {
      background-color: rgba(255, 255, 255, 0.92);
      color: var(--ink-main);
      border: 1px solid rgba(26, 29, 33, 0.14);
      border-radius: 9999px;
      font-weight: 600;
      transition: all 0.18s ease;
    }
    .btn-pill-soft:hover {
      border-color: var(--accent-orange);
      color: #B85200;
      background-color: #FFF9F2;
    }

    .privacy-blur .sensitive-content {
      filter: blur(8px);
      transition: filter 0.2s ease;
      user-select: none;
    }
    .privacy-blur .sensitive-content:hover {
      filter: blur(0);
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(255, 122, 0, 0.14), rgba(166, 213, 247, 0.22));
      color: #B85200;
      font-weight: 700;
    }

    .heat-cell {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      transition: transform 0.12s ease;
    }
    .heat-cell:hover {
      transform: scale(1.25);
    }

    .mic-recording {
      background-color: #DC2626 !important;
      color: #FFFFFF !important;
      border-color: #DC2626 !important;
      animation: pulseMic 1.1s infinite;
    }
    @keyframes pulseMic {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(26, 29, 33, 0.16); border-radius: 999px; }
  </style>
</head>
<body class="antialiased">

  <!-- ==================== 1. PRIVATE LOGIN GATE (靜態登入殼) ==================== -->
  <section id="loginGate" class="min-h-screen flex items-center justify-center p-4 sm:p-8">
    <div class="glass-card w-full max-w-xl rounded-3xl p-7 sm:p-10 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-5" style="background: linear-gradient(135deg, #FF7A00, #A6D5F7);">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>

      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-[#1A1D21] mb-3">DriveNote 個人雲端記事本</h1>
      <p class="text-[18px] text-[#525B66] mb-7">
        此頁面為靜態登入殼，所有筆記資料僅存於你私人的 Google Drive，未通過 Google 帳號驗證前不顯示任何內容。
      </p>

      <div class="space-y-3.5">
        <button id="btnGoogleLogin" type="button" class="btn-pill-orange w-full py-3.5 px-6 text-[19px] flex items-center justify-center gap-3">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/>
          </svg>
          使用 Google 帳號登入並同步 Drive
        </button>

        <button id="btnDemoLogin" type="button" class="btn-pill-soft w-full py-3.5 px-6 text-[18px]">
          先進入本機試用模式（含範例資料・免 OAuth）
        </button>
      </div>

      <div class="mt-6 pt-5 border-t border-slate-200/80 flex flex-wrap items-center justify-between gap-3 text-[16px] text-[#525B66]">
        <button id="btnOpenOAuthConfig" type="button" class="underline hover:text-[#FF7A00] font-medium">
          設定 Google OAuth Client ID
        </button>
        <span id="oauthStatusBadge" class="mono text-[14px] px-3 py-1 rounded-full bg-slate-100 text-slate-700">
          未設定 Client ID
        </span>
      </div>
    </div>
  </section>

  <!-- ==================== 2. MAIN WORKSPACE SHELL ==================== -->
  <div id="appShell" class="hidden min-h-screen flex flex-col">
    <!-- Top Navbar -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button id="btnMobileMenu" type="button" class="lg:hidden p-2 rounded-xl hover:bg-slate-100 text-slate-700" aria-label="開啟選單">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl flex items-center justify-center text-white font-bold text-base shrink-0" style="background: linear-gradient(135deg, #FF7A00, #A6D5F7);">D</span>
            <span class="font-bold text-[20px] tracking-tight truncate">DriveNote</span>
          </div>
          <span id="syncStatusPill" class="hidden sm:inline-flex items-center gap-1.5 text-[14px] font-medium px-3 py-1 rounded-full bg-sky-50 text-[#1D5B8C] border border-sky-200/70">
            <span id="syncDot" class="w-2 h-2 rounded-full bg-[#FF7A00]"></span>
            <span id="syncStatusText">本機模式</span>
          </span>
        </div>

        <!-- Global Search -->
        <div class="hidden md:flex flex-1 max-w-md mx-2">
          <input id="globalSearchInput" type="search" placeholder="搜尋日記、靈感、學習、收件匣、#標籤..." class="w-full px-4 py-2 rounded-full bg-slate-100/90 border border-transparent focus:border-[#FF7A00] focus:bg-white outline-none text-[16px]">
        </div>

        <!-- Action Toolbar -->
        <div class="flex items-center gap-2 shrink-0">
          <button id="btnSyncNow" type="button" class="btn-pill-soft px-3.5 py-1.5 text-[15px] hidden sm:inline-flex items-center gap-1.5" title="立即同步 Google Drive">
            同步
          </button>
          <button id="btnPrivacyToggle" type="button" class="btn-pill-soft px-3.5 py-1.5 text-[15px]" title="切換防窺模糊模式">
            防窺
          </button>
          <button id="btnOpenAiExport" type="button" class="btn-pill-orange px-4 py-1.5 text-[15px]" title="產生 AI 復盤用結構化文字">
            AI 復盤
          </button>
          <button id="btnOpenSettings" type="button" class="p-2 rounded-full hover:bg-slate-100 text-slate-700" title="備份、閒置鎖定與 Drive 設定" aria-label="設定">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
          <button id="btnLogout" type="button" class="p-2 rounded-full hover:bg-red-50 text-slate-600 hover:text-red-600" title="鎖定並登出" aria-label="登出">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Body Grid -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 pb-28 lg:pb-10">
      <!-- Sidebar Nav -->
      <aside id="sidebarNav" class="hidden lg:block lg:col-span-3">
        <div class="glass-card rounded-3xl p-4 sticky top-24 space-y-1">
          <button type="button" data-tab="dashboard" class="nav-item active w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>總覽・週報・熱力圖</span>
            <span id="badgeDue" class="mono text-[13px] px-2 py-0.5 rounded-full bg-orange-100 text-[#B85200]">0</span>
          </button>
          <button type="button" data-tab="inbox" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>暫存收件匣 Inbox</span>
            <span id="badgeInbox" class="mono text-[13px] px-2 py-0.5 rounded-full bg-sky-100 text-[#1D5B8C]">0</span>
          </button>
          <button type="button" data-tab="diary" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>每日日記</span>
            <span id="badgeDiary" class="mono text-[13px] text-slate-500">0</span>
          </button>
          <button type="button" data-tab="ideas" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>Idea 創意區</span>
            <span id="badgeIdeas" class="mono text-[13px] text-slate-500">0</span>
          </button>
          <button type="button" data-tab="learning" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>學習狀態與番茄鐘</span>
            <span id="badgeLearning" class="mono text-[13px] text-slate-500">0</span>
          </button>
          <button type="button" data-tab="todos" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>待完成與重複任務</span>
            <span id="badgeTodos" class="mono text-[13px] text-slate-500">0</span>
          </button>
          <button type="button" data-tab="vault" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>帳號提示區</span>
            <span id="badgeVault" class="mono text-[13px] text-slate-500">0</span>
          </button>
          <button type="button" data-tab="snippets" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>常用片段與書籤</span>
            <span id="badgeSnippets" class="mono text-[13px] text-slate-500">0</span>
          </button>
          <button type="button" data-tab="hub" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between">
            <span>專案聚合總覽</span>
            <span class="mono text-[13px] text-[#1D5B8C]">Hub</span>
          </button>
          <button type="button" data-tab="trash" class="nav-item w-full text-left px-4 py-2.5 rounded-2xl text-[17px] flex items-center justify-between text-slate-600">
            <span>30 天回收桶</span>
            <span id="badgeTrash" class="mono text-[13px] text-slate-400">0</span>
          </button>

          <div class="pt-3 mt-2 border-t border-slate-200/70">
            <div class="text-[14px] font-semibold text-slate-500 px-3 mb-2">常用專案標籤</div>
            <div id="sidebarTags" class="flex flex-wrap gap-1.5 px-2"></div>
          </div>
        </div>
      </aside>

      <!-- Main Content View -->
      <main id="mainContent" class="lg:col-span-9 space-y-6 min-w-0"></main>
    </div>

    <!-- Mobile Quick Capture Bar (with Voice-to-Text Mic!) -->
    <div class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-3 py-2.5">
      <div class="flex items-center gap-2 max-w-xl mx-auto">
        <select id="quickCaptureType" class="px-2.5 py-2 rounded-full bg-slate-100 text-[15px] font-medium outline-none">
          <option value="inbox">收件匣</option>
          <option value="idea">靈感</option>
          <option value="todo">待辦</option>
          <option value="diary">日記</option>
        </select>
        <input id="quickCaptureInput" type="text" placeholder="3 秒快記或語音輸入..." class="flex-1 min-w-0 px-3.5 py-2 rounded-full bg-slate-100 text-[16px] outline-none focus:ring-2 focus:ring-[#FF7A00]">
        <button id="btnQuickVoice" type="button" class="btn-pill-soft p-2 shrink-0" title="語音轉文字快記" aria-label="語音輸入">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
        </button>
        <button id="btnQuickCapture" type="button" class="btn-pill-orange px-4 py-2 text-[15px] shrink-0">記下</button>
      </div>
    </div>
  </div>

  <!-- ==================== 3. MODALS ==================== -->
  <div id="modalBackdrop" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="modalBox" class="glass-card bg-white w-full max-w-2xl rounded-3xl p-6 sm:p-8 max-h-[88vh] overflow-y-auto"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-20 right-5 z-50 px-5 py-3 rounded-2xl bg-[#1A1D21] text-white text-[16px] font-medium shadow-xl"></div>

<script>
(() => {
  // ==================== CONFIG & STORAGE KEYS ====================
  const DEFAULT_GOOGLE_CLIENT_ID = '';
  const STORAGE_DATA_KEY = 'drivenote_data_v1';
  const STORAGE_CLIENT_ID_KEY = 'drivenote_google_client_id';
  const STORAGE_IDLE_KEY = 'drivenote_idle_lock_mins';
  const DRIVE_FOLDER_NAME = 'MyPersonalNotebook';
  const DRIVE_ATTACH_FOLDER = 'attachments';
  const DRIVE_DATA_FILE = 'notebook_data.json';

  const state = {
    mode: 'locked', // 'locked' | 'local' | 'google'
    activeTab: 'dashboard',
    selectedHubTag: '',
    searchQuery: '',
    privacyBlur: false,
    idleLockMinutes: 15, // 0 = off
    accessToken: null,
    driveFileId: null,
    driveFolderId: null,
    driveAttachFolderId: null,
    clientId: DEFAULT_GOOGLE_CLIENT_ID,
    data: null,
    pendingDiaryAttachment: null,
    pomo: {
      topicId: '',
      mode: 'focus', // 'focus' (25m) | 'break' (5m)
      secondsLeft: 25 * 60,
      running: false,
      timerId: null
    }
  };

  // ==================== SAFE STORAGE & DATE HELPERS ====================
  function safeGet(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); } catch {}
  }

  function todayStr(offsetDays = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.toISOString().slice(0, 10);
  }
  function nextWeekendStr() {
    const d = new Date();
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const diff = day === 6 ? 7 : (6 - day);
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  }
  function uid(prefix) {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
  }
  function esc(str = '') {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
  function parseTags(str = '') {
    return [...new Set(str.split(/[\s,，#]+/).map(s => s.trim()).filter(Boolean))];
  }
  function downloadTextFile(filename, text, mime = 'text/markdown;charset=utf-8') {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ==================== SEED DATA & MIGRATION ====================
  function createSeedData() {
    return {
      version: 2,
      updatedAt: new Date().toISOString(),
      inbox: [
        {
          id: 'in_1',
          content: '看到一篇討論 Local-First Web App 離線同步架構的好文章，週末整理進學習筆記。',
          url: 'https://developers.google.com/workspace/drive/api/guides/manage-uploads',
          createdAt: todayStr(0), updatedAt: new Date().toISOString()
        }
      ],
      diaryEntries: [
        {
          id: 'd_1', date: todayStr(0), mood: 5,
          habits: ['閱讀', '運動', '寫筆記'],
          content: '今天完成個人雲端記事本完整版架構，把收件匣、番茄鐘、回收桶跟語音快記全部整合進來了！',
          tags: ['SideProject', '效率系統'], attachment: null, updatedAt: new Date().toISOString()
        },
        {
          id: 'd_2', date: todayStr(-1), mood: 4,
          habits: ['閱讀', '寫筆記'],
          content: '整理了一批論文資料，發現把待補文獻直接標成專案標籤，回頭找參考資料快很多。',
          tags: ['論文', '閱讀'], attachment: null, updatedAt: new Date().toISOString()
        },
        {
          id: 'd_3', date: todayStr(-7), mood: 4,
          habits: ['運動', '閱讀'],
          content: '一週前的紀錄：決定開始建立屬於自己的 Google Drive 個人知識系統，把零散筆記統一起來。',
          tags: ['SideProject'], attachment: null, updatedAt: new Date().toISOString()
        },
        {
          id: 'd_4', date: todayStr(-30), mood: 3,
          habits: ['閱讀'],
          content: '一個月前的回顧：調整每日專注節奏，改成用 25 分鐘番茄鐘拆分大型研究任務。',
          tags: ['論文'], attachment: null, updatedAt: new Date().toISOString()
        }
      ],
      ideas: [

  function ensureDataShape(d) {
    const seed = createSeedData();
    const out = Object.assign({}, seed, d || {});
    ['inbox', 'diaryEntries', 'ideas', 'learningLogs', 'todos', 'accountHints', 'snippets', 'trash'].forEach(k => {
      if (!Array.isArray(out[k])) out[k] = [];
    });
    // Auto-prune trash older than 30 days
    const cutoff = Date.now() - 30 * 86400000;
    out.trash = out.trash.filter(item => new Date(item.deletedAt || Date.now()).getTime() >= cutoff);
    return out;
  }

  let toastTimer = null;

  function copyText(text, successMsg = '已複製到剪貼簿') {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
    } else {
      fallbackCopy(text, successMsg);
    }
  }
  function fallbackCopy(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(successMsg); } catch { showToast('請手動全選複製'); }
    document.body.removeChild(ta);
  }

  // ==================== VOICE-TO-TEXT (Web Speech API) ====================
  let activeRecognition = null;
  function toggleVoiceInput(targetInputEl, btnEl) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showToast('目前瀏覽器不支援語音輸入，建議使用 Chrome 或 Edge');
      return;
    }
    if (activeRecognition) {
      activeRecognition.stop();
      activeRecognition = null;
      btnEl.classList.remove('mic-recording');
      return;
    }
    try {
      const rec = new SR();
      rec.lang = 'zh-TW';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      activeRecognition = rec;
      btnEl.classList.add('mic-recording');
      showToast('正在聆聽，請直接說話...');
      rec.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || '';
        if (transcript && targetInputEl) {
          targetInputEl.value = targetInputEl.value ? `${targetInputEl.value} ${transcript}` : transcript;
          targetInputEl.focus();
          showToast('已轉為文字！');
        }
      };
      rec.onerror = () => showToast('語音辨識未成功，請確認麥克風權限');
      rec.onend = () => {
        activeRecognition = null;
        btnEl.classList.remove('mic-recording');
      };
      rec.start();
    } catch {
      btnEl.classList.remove('mic-recording');
      showToast('無法啟動語音輸入');
    }
  }

  async function loadGsiScript() {
    if (window.google?.accounts?.oauth2) return true;
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => resolve(true);
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  }

  async function startGoogleLogin() {
    const cid = (state.clientId || '').trim();
    if (!cid) {
      openOAuthConfigModal();
      showToast('請先填入你的 Google OAuth Client ID');
      return;
    }
    const ok = await loadGsiScript();
    if (!ok || !window.google?.accounts?.oauth2) {
      showToast('目前環境無法載入 Google 登入服務，請於 GitHub Pages 或一般瀏覽器開啟');
      return;
    }
    try {
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
        callback: async (resp) => {
          if (resp.error) {
            showToast('Google 授權取消或未通過白名單驗證');
            return;
          }
          state.accessToken = resp.access_token;
          state.mode = 'google';
          enterWorkspace();
          await syncWithGoogleDrive(true);
        }
      });
      tokenClient.requestAccessToken({ prompt: 'consent' });
    } catch {
      showToast('無法啟動 Google OAuth，請確認網址已加入授權來源');
    }
  }

  async function driveFetch(url, options = {}) {
    const headers = Object.assign({ Authorization: `Bearer ${state.accessToken}` }, options.headers || {});
    const res = await fetch(url, { ...options, headers });
    if (!res.ok) throw new Error(`Drive API ${res.status}`);
    return res;
  }

  async function ensureDriveFolder(name = DRIVE_FOLDER_NAME, parentId = null) {
    const parentClause = parentId ? ` and '${parentId}' in parents` : '';
    const q = encodeURIComponent(`name='${name}' and mimeType='application/vnd.google-apps.folder'${parentClause} and trashed=false`);
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
    const json = await res.json();
    if (json.files?.length > 0) return json.files[0].id;
    const body = { name, mimeType: 'application/vnd.google-apps.folder' };
    if (parentId) body.parents = [parentId];
    const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const created = await createRes.json();
    return created.id;
  }

  async function uploadAttachmentToDrive(file) {
    if (state.mode !== 'google' || !state.accessToken) return null;
    try {
      if (!state.driveFolderId) state.driveFolderId = await ensureDriveFolder(DRIVE_FOLDER_NAME);
      if (!state.driveAttachFolderId) state.driveAttachFolderId = await ensureDriveFolder(DRIVE_ATTACH_FOLDER, state.driveFolderId);
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({ name: `${todayStr(0)}_${file.name}`, parents: [state.driveAttachFolderId] })], { type: 'application/json' }));
      form.append('file', file);
      const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
        method: 'POST',
        body: form
      });
      return await res.json();
    } catch {
      return null;
    }
  }

  function mergeCollections(localArr = [], remoteArr = []) {
    const map = new Map();
    [...remoteArr, ...localArr].forEach(item => {
      const prev = map.get(item.id);
      if (!prev || new Date(item.updatedAt || 0) >= new Date(prev.updatedAt || 0)) {
        map.set(item.id, item);
      }
    });
    return [...map.values()];
  }

  async function syncWithGoogleDrive(initialPull = false) {
    if (state.mode !== 'google' || !state.accessToken) {
      showToast('目前為本機試用模式，已自動儲存在瀏覽器');
      return;
    }
    updateSyncBadge('同步中...', '#FF7A00');
    try {
      if (!state.driveFolderId) state.driveFolderId = await ensureDriveFolder(DRIVE_FOLDER_NAME);
      const q = encodeURIComponent(`name='${DRIVE_DATA_FILE}' and '${state.driveFolderId}' in parents and trashed=false`);
      const listRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)`);
      const listJson = await listRes.json();

      if (listJson.files?.length > 0) {
        state.driveFileId = listJson.files[0].id;
        const fileRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${state.driveFileId}?alt=media`);
        const remoteData = await fileRes.json();
        if (initialPull && remoteData) {
          const r = ensureDataShape(remoteData);
          state.data = ensureDataShape({
            version: 2,
            updatedAt: new Date().toISOString(),
            inbox: mergeCollections(state.data.inbox, r.inbox),
            diaryEntries: mergeCollections(state.data.diaryEntries, r.diaryEntries),
            ideas: mergeCollections(state.data.ideas, r.ideas),
            learningLogs: mergeCollections(state.data.learningLogs, r.learningLogs),
            todos: mergeCollections(state.data.todos, r.todos),
            accountHints: mergeCollections(state.data.accountHints, r.accountHints),
            snippets: mergeCollections(state.data.snippets, r.snippets),
            trash: mergeCollections(state.data.trash, r.trash)
          });
          safeSet(STORAGE_DATA_KEY, state.data);
        }
        await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${state.driveFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.data, null, 2)
        });
      } else {
        const boundary = 'drivenote_sync_boundary';
        const metadata = { name: DRIVE_DATA_FILE, parents: [state.driveFolderId], mimeType: 'application/json' };
        const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(state.data, null, 2)}\r\n--${boundary}--`;
        const uploadRes = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
          body
        });
        const uploaded = await uploadRes.json();
        state.driveFileId = uploaded.id;
      }
      updateSyncBadge('Drive 已同步', '#10B981');
      ensureDailyDriveBackup();
      renderAll();
      showToast('已與 Google Drive 完成同步');
    } catch {
      updateSyncBadge('離線暫存', '#F59E0B');
      showToast('雲端同步失敗，變更已安全保存在本機');
    }
  }

    state.data[col] = arr.filter(x => x.id !== id);
    state.data.trash.unshift({

      updatedAt: new Date().toISOString()
    });

    const tr = state.data.trash.find(x => x.id === trashId);
    if (!tr) return;
    if (!Array.isArray(state.data[tr.sourceCol])) state.data[tr.sourceCol] = [];
    state.data[tr.sourceCol].unshift({ ...tr.item, updatedAt: new Date().toISOString() });

  // ==================== POMODORO ENGINE ====================
  function formatTime(secs) {
    const m = Math.floor(secs / 60).toString().padStart(2, '0');
    const s = (secs % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function creditPomodoroMinutes(mins) {
    if (mins <= 0) return;
    const topicId = state.pomo.topicId || state.data.learningLogs[0]?.id;
    const log = state.data.learningLogs.find(l => l.id === topicId);
    if (log) {
      log.minutesSpent = Number(log.minutesSpent || 0) + mins;
      log.date = todayStr(0);
      log.updatedAt = new Date().toISOString();
      persistData();
      showToast(`已將 ${mins} 分鐘專注時間累加至「${log.topic}」`);
    } else {
      showToast('請先新增至少一個學習主題以累加時數');
    }
  }

  function startPomodoro() {
    clearInterval(state.pomo.timerId);
    state.pomo.running = true;
    state.pomo.timerId = setInterval(() => {
      if (state.pomo.secondsLeft > 0) {
        state.pomo.secondsLeft -= 1;
        const readout = document.getElementById('pomoReadout');
        if (readout) readout.textContent = formatTime(state.pomo.secondsLeft);
      } else {
        clearInterval(state.pomo.timerId);
        state.pomo.running = false;
        if (state.pomo.mode === 'focus') {
          creditPomodoroMinutes(25);
          state.pomo.mode = 'break';
          state.pomo.secondsLeft = 5 * 60;
        } else {
          state.pomo.mode = 'focus';
          state.pomo.secondsLeft = 25 * 60;
          showToast('休息結束，準備開始下一個 25 分鐘專注！');
        }
        renderAll();
      }
    }, 1000);
    renderAll();
  }

  function getAllTags() {
    const counts = {};
    [state.data.diaryEntries, state.data.ideas, state.data.learningLogs, state.data.todos, state.data.accountHints, state.data.snippets]
      .forEach(arr => arr.forEach(item => (item.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; })));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  function getUpcomingRadarItems() {
    const now = new Date(todayStr(0));
    const items = [];
    state.data.todos.filter(t => !t.done && t.dueDate).forEach(t => {
      const diff = Math.round((new Date(t.dueDate) - now) / 86400000);
      if (diff <= 14) items.push({ type: t.category, title: t.title, date: t.dueDate, diff, tab: 'todos' });
    });
    state.data.accountHints.filter(v => v.renewalDate).forEach(v => {
      const diff = Math.round((new Date(v.renewalDate) - now) / 86400000);
      if (diff <= 14) items.push({ type: '續約提醒', title: v.serviceName, date: v.renewalDate, diff, tab: 'vault' });
    });
    return items.sort((a, b) => a.diff - b.diff);
  }

  function getOnThisDayEntries() {
    const today = todayStr(0);
    const md = today.slice(5); // MM-DD
    const d7 = todayStr(-7);
    const d30 = todayStr(-30);
    return state.data.diaryEntries.filter(e => {
      if (e.date === today) return false;
      return e.date.slice(5) === md || e.date === d7 || e.date === d30;
    });
  }

  function matchesSearch(obj) {
    const q = state.searchQuery.trim().toLowerCase();

      obj.serviceName, obj.loginEmail, obj.bitwardenFolder, (obj.tags || []).join(' ')
    ].filter(Boolean).join(' ').toLowerCase();
    return text.includes(q.replace(/^#/, ''));
  }

  function buildHeatmapHtml() {
    const entryByDate = {};
    state.data.diaryEntries.forEach(e => { entryByDate[e.date] = e; });
    const cells = [];
    for (let i = 97; i >= 0; i--) {
      const ds = todayStr(-i);
      const entry = entryByDate[ds];
      let level = 0;
      let tip = `${ds}：無紀錄`;
      if (entry) {
        const score = (Number(entry.mood) || 3) + (entry.habits?.length || 0);
        level = score >= 7 ? 4 : score >= 5 ? 3 : score >= 3 ? 2 : 1;
        tip = `${ds}｜心情 ${entry.mood}/5｜習慣：${(entry.habits || []).join('、') || '無'}`;
      }
      const colors = ['#EEF2F6', '#FFD9B3', '#FFB366', '#FF7A00', '#1D5B8C'];
      cells.push(`<div class="heat-cell" style="background:${colors[level]}" title="${esc(tip)}"></div>`);
    }
    return `
      <div class="glass-card rounded-3xl p-6">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">

  // ==================== DYNAMIC HANDLERS ====================
  function bindMainViewHandlers() {
    const main = document.getElementById('mainContent');

    // Inbox form & triage
    const formInbox = document.getElementById('formInbox');
    if (formInbox) {
      formInbox.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formInbox);
        state.data.inbox.unshift({
          id: uid('in'), content: String(fd.get('content')).trim(),
          url: String(fd.get('url') || '').trim(),
          createdAt: todayStr(0), updatedAt: new Date().toISOString()
        });
        persistData();
        showToast('已存入暫存收件匣');
      });
    }
    main.querySelectorAll('[data-triage]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [dest, id] = btn.dataset.triage.split(':');
        const item = state.data.inbox.find(x => x.id === id);
        if (!item) return;
        if (dest === 'idea') {
          state.data.ideas.unshift({ id: uid('i'), title: item.content.slice(0, 48), notes: item.url ? `${item.content}\n${item.url}` : item.content, status: '萌芽', priority: '中', tags: ['Inbox轉入'], linkedTodoId: '', updatedAt: new Date().toISOString() });
        } else if (dest === 'todo') {
          state.data.todos.unshift({ id: uid('t'), title: item.content.slice(0, 60), category: '行動待辦', dueDate: todayStr(2), done: false, repeat: 'none', sourceIdeaId: '', tags: ['Inbox轉入'], updatedAt: new Date().toISOString() });
        } else if (dest === 'diary') {
          state.data.diaryEntries.unshift({ id: uid('d'), date: todayStr(0), mood: 4, habits: ['寫筆記'], content: item.url ? `${item.content}\n參考連結：${item.url}` : item.content, tags: ['Inbox轉入'], attachment: null, updatedAt: new Date().toISOString() });
        } else if (dest === 'snippet') {
          state.data.snippets.unshift({ id: uid('s'), title: item.content.slice(0, 36), category: item.url ? '工具書籤' : '常用片段', content: item.content, url: item.url || '', tags: ['Inbox轉入'], updatedAt: new Date().toISOString() });
        }
        state.data.inbox = state.data.inbox.filter(x => x.id !== id);
        persistData();
        showToast('已成功轉入目標模組');
      });
    });

    // Diary templates, voice & attachment
    const btnDiaryVoice = document.getElementById('btnDiaryVoice');
    if (btnDiaryVoice) {
      btnDiaryVoice.addEventListener('click', () => toggleVoiceInput(document.getElementById('diaryTextarea'), btnDiaryVoice));
    }
    const diaryFileInput = document.getElementById('diaryFileInput');
    if (diaryFileInput) {
      diaryFileInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const nameEl = document.getElementById('diaryFileName');
        if (nameEl) nameEl.textContent = `處理中：${file.name}`;
        let previewDataUrl = '';
        if (file.type.startsWith('image/') && file.size < 1200000) {
          previewDataUrl = await new Promise(res => {
            const r = new FileReader();
            r.onload = () => res(String(r.result));
            r.onerror = () => res('');
            r.readAsDataURL(file);
          });
        }
        const driveInfo = await uploadAttachmentToDrive(file);
        state.pendingDiaryAttachment = {
          name: file.name,
          mimeType: file.type,
          previewDataUrl,
          driveFileId: driveInfo?.id || '',
          webViewLink: driveInfo?.webViewLink || ''
        };
        if (nameEl) nameEl.textContent = driveInfo?.id ? `已上傳 Drive：${file.name}` : `已附加：${file.name}`;
        showToast(driveInfo?.id ? '附件已上傳至 Google Drive attachments 資料夾' : '已附加檔案（將於儲存日記時保留）');
      });

      });
    });

    // Markdown exports (Diary, Learning, Project Hub)
    main.querySelectorAll('[data-md-diary]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = state.data.diaryEntries.find(x => x.id === btn.dataset.mdDiary);
        if (!e) return;
        const md = `# 日記 ${e.date}\n\n- 心情：${e.mood}/5\n- 習慣：${(e.habits || []).join('、') || '無'}\n- 標籤：${(e.tags || []).map(t => '#' + t).join(' ')}\n\n${e.content}\n`;

        showToast('已匯出日記 Markdown');
      });
    });
    main.querySelectorAll('[data-md-learn]').forEach(btn => {
      btn.addEventListener('click', () => {

        const md = `# 學習筆記：${l.topic}\n\n- 日期：${l.date}\n- 完成度：${l.progressPct}%\n- 累積投入：${l.minutesSpent} 分鐘\n- 標籤：${(l.tags || []).map(t => '#' + t).join(' ')}\n\n## 重點里程碑\n${l.milestone || '無'}\n`;
        downloadTextFile(`learning_${l.date}.md`, md);
        showToast('已匯出學習筆記 Markdown');
      });
    });
    const btnExportHubMd = document.getElementById('btnExportHubMd');
    if (btnExportHubMd) {
      btnExportHubMd.addEventListener('click', () => {
        const tag = state.selectedHubTag;
        const hasTag = x => (x.tags || []).includes(tag);
        const md = [
          `# 專案總覽：#${tag}`,
          '',
          '## 待辦任務',
          ...state.data.todos.filter(hasTag).map(t => `- [${t.done ? 'x' : ' '}] ${t.title} (${t.dueDate || '無期限'})`),
          '',
          '## 學習進度',
          ...state.data.learningLogs.filter(hasTag).map(l => `- ${l.topic}：${l.progressPct}%（${l.minutesSpent}m）— ${l.milestone}`),
          '',
          '## 相關 Idea',
          ...state.data.ideas.filter(hasTag).map(i => `- [${i.status}] ${i.title}：${i.notes}`),
          '',
          '## 相關日記',
          ...state.data.diaryEntries.filter(hasTag).map(d => `- [${d.date}] ${d.content}`)
        ].join('\n');
        downloadTextFile(`project_${tag}.md`, md);
        showToast(`已匯出 #${tag} 專案 Markdown`);
      });
    }

    // Pomodoro handlers
    const pomoSelect = document.getElementById('pomoTopicSelect');
    if (pomoSelect) pomoSelect.addEventListener('change', () => { state.pomo.topicId = pomoSelect.value; });
    const btnPomoToggle = document.getElementById('btnPomoToggle');
    if (btnPomoToggle) {
      btnPomoToggle.addEventListener('click', () => {
        if (state.pomo.running) {
          clearInterval(state.pomo.timerId);
          state.pomo.running = false;
          renderAll();
        } else {
          startPomodoro();
        }
      });
    }
    const btnPomoReset = document.getElementById('btnPomoReset');
    if (btnPomoReset) {
      btnPomoReset.addEventListener('click', () => {
        clearInterval(state.pomo.timerId);
        state.pomo.running = false;
        state.pomo.secondsLeft = state.pomo.mode === 'focus' ? 25 * 60 : 5 * 60;
        renderAll();
      });
    }
    const btnPomoModeFocus = document.getElementById('btnPomoModeFocus');
    if (btnPomoModeFocus) {
      btnPomoModeFocus.addEventListener('click', () => {
        clearInterval(state.pomo.timerId);
        state.pomo.running = false;
        state.pomo.mode = 'focus';
        state.pomo.secondsLeft = 25 * 60;
        renderAll();
      });
    }
    const btnPomoModeBreak = document.getElementById('btnPomoModeBreak');
    if (btnPomoModeBreak) {
      btnPomoModeBreak.addEventListener('click', () => {
        clearInterval(state.pomo.timerId);
        state.pomo.running = false;
        state.pomo.mode = 'break';
        state.pomo.secondsLeft = 5 * 60;
        renderAll();
      });
    }
    const btnPomoLogNow = document.getElementById('btnPomoLogNow');
    if (btnPomoLogNow) btnPomoLogNow.addEventListener('click', () => creditPomodoroMinutes(25));

    // Learning range slider readout
    const learnRange = document.getElementById('learnRange');
    if (learnRange) {
      learnRange.addEventListener('input', () => {
        document.getElementById('learnRangeVal').textContent = `${learnRange.value}%`;
      });
    }

    // Forms
    const formDiary = document.getElementById('formDiary');
    if (formDiary) {
      formDiary.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formDiary);
        state.data.diaryEntries.unshift({
          id: uid('d'), date: fd.get('date'), mood: Number(fd.get('mood')),
          habits: fd.getAll('habit'), content: String(fd.get('content')).trim(),
          tags: parseTags(fd.get('tags')), attachment: state.pendingDiaryAttachment,
          updatedAt: new Date().toISOString()
        });
        state.pendingDiaryAttachment = null;
        persistData();
        showToast('已儲存今日日記');
      });
    }

    const formIdea = document.getElementById('formIdea');
    if (formIdea) {
      formIdea.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formIdea);
        state.data.ideas.unshift({
          id: uid('i'), title: String(fd.get('title')).trim(), notes: String(fd.get('notes')).trim(),
          status: '萌芽', priority: fd.get('priority'), tags: parseTags(fd.get('tags')),
          linkedTodoId: '', updatedAt: new Date().toISOString()
        });
        persistData();
        showToast('已加入創意想法區');
      });
    }

    const formLearning = document.getElementById('formLearning');
    if (formLearning) {
      formLearning.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formLearning);
        state.data.learningLogs.unshift({
          id: uid('l'), topic: String(fd.get('topic')).trim(),
          progressPct: Number(fd.get('progressPct')), minutesSpent: Number(fd.get('minutesSpent') || 0),
          milestone: String(fd.get('milestone')).trim(), resourceUrl: '',
          date: todayStr(0), tags: parseTags(fd.get('tags')), updatedAt: new Date().toISOString()
        });
        persistData();
        showToast('已更新學習狀態並關聯今日日記');
      });
    }

    const formTodo = document.getElementById('formTodo');
    if (formTodo) {
      formTodo.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formTodo);
        state.data.todos.unshift({
          id: uid('t'), title: String(fd.get('title')).trim(), category: fd.get('category'),
          dueDate: fd.get('dueDate'), done: false, repeat: fd.get('repeat'),
          sourceIdeaId: '', tags: parseTags(fd.get('tags')), updatedAt: new Date().toISOString()
        });
        persistData();
        showToast('已新增待辦項目');
      });
    }

    const formVault = document.getElementById('formVault');
    if (formVault) {
      formVault.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formVault);
        state.data.accountHints.unshift({
          id: uid('v'), serviceName: String(fd.get('serviceName')).trim(),
          loginEmail: String(fd.get('loginEmail')).trim(), authType: fd.get('authType'),
          bitwardenFolder: String(fd.get('bitwardenFolder')).trim(),
          renewalDate: fd.get('renewalDate'), notes: String(fd.get('notes')).trim(),
          tags: parseTags(fd.get('tags')), updatedAt: new Date().toISOString()
        });
        persistData();
        showToast('已儲存帳號提示索引');
      });
    }

    const formSnippet = document.getElementById('formSnippet');
    if (formSnippet) {
      formSnippet.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(formSnippet);
        state.data.snippets.unshift({
          id: uid('s'), title: String(fd.get('title')).trim(), category: fd.get('category'),
          content: String(fd.get('content')).trim(), url: String(fd.get('url')).trim(),
          tags: parseTags(fd.get('tags')), updatedAt: new Date().toISOString()
        });
        persistData();
        showToast('已收入常用片段與書籤庫');
      });
    }

    // Idea -> Todo promotion
    main.querySelectorAll('[data-promote-idea]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idea = state.data.ideas.find(x => x.id === btn.dataset.promoteIdea);
        if (!idea) return;
        const tid = uid('t');
        state.data.todos.unshift({
          id: tid, title: `[靈感落地] ${idea.title}`, category: '行動待辦',
          dueDate: todayStr(3), done: false, repeat: 'none',
          sourceIdeaId: idea.id, tags: [...(idea.tags || [])], updatedAt: new Date().toISOString()
        });
        idea.linkedTodoId = tid;
        idea.status = '評估中';
        idea.updatedAt = new Date().toISOString();
        persistData();
        showToast('已一鍵轉為待辦任務');
      });
    });

    // Learning +10%
    main.querySelectorAll('[data-bump-learn]').forEach(btn => {
      btn.addEventListener('click', () => {
        const log = state.data.learningLogs.find(x => x.id === btn.dataset.bumpLearn);
        if (!log) return;
        log.progressPct = Math.min(100, Number(log.progressPct) + 10);
        log.updatedAt = new Date().toISOString();
        persistData();
      });
    });

    // Todo toggle (Recurring + Linked Idea)
    main.querySelectorAll('[data-toggle-todo]').forEach(chk => {
      chk.addEventListener('change', () => {
        const todo = state.data.todos.find(x => x.id === chk.dataset.toggleTodo);
        if (!todo) return;
        todo.done = chk.checked;
        todo.updatedAt = new Date().toISOString();
        if (todo.done && todo.sourceIdeaId) {
          const idea = state.data.ideas.find(x => x.id === todo.sourceIdeaId);
          if (idea) { idea.status = '已落地'; idea.updatedAt = new Date().toISOString(); }
        }
        if (todo.done && todo.repeat && todo.repeat !== 'none') {
          const base = todo.dueDate ? new Date(todo.dueDate) : new Date();
          if (todo.repeat === 'daily') base.setDate(base.getDate() + 1);
          if (todo.repeat === 'weekly') base.setDate(base.getDate() + 7);
          if (todo.repeat === 'monthly') base.setMonth(base.getMonth() + 1);
          const nextDate = base.toISOString().slice(0, 10);
          state.data.todos.unshift({ ...todo, id: uid('t'), done: false, dueDate: nextDate, updatedAt: new Date().toISOString() });
          showToast(`已完成並自動建立下一期任務（${nextDate}）`);
        }
        persistData();
      });
    });

    // Todo snooze +1 day & move to weekend
    main.querySelectorAll('[data-snooze-todo]').forEach(btn => {
      btn.addEventListener('click', () => {
        const todo = state.data.todos.find(x => x.id === btn.dataset.snoozeTodo);
        if (!todo) return;
        const base = todo.dueDate ? new Date(todo.dueDate) : new Date();
        base.setDate(base.getDate() + 1);
        todo.dueDate = base.toISOString().slice(0, 10);
        todo.updatedAt = new Date().toISOString();
        persistData();
        showToast(`已順延至 ${todo.dueDate}`);
      });
    });
    main.querySelectorAll('[data-weekend-todo]').forEach(btn => {
      btn.addEventListener('click', () => {
        const todo = state.data.todos.find(x => x.id === btn.dataset.weekendTodo);
        if (!todo) return;
        todo.dueDate = nextWeekendStr();
        todo.updatedAt = new Date().toISOString();
        persistData();
        showToast(`已移至週末（${todo.dueDate}）`);
      });
    });

    // Copy snippet
    main.querySelectorAll('[data-copy-snippet]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = state.data.snippets.find(x => x.id === btn.dataset.copySnippet);
        if (s) copyText(s.content || s.url || s.title, '已複製片段內容');
      });
    });

    // Soft Delete & Trash actions
    main.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [col, id] = btn.dataset.del.split(':');
        softDeleteItem(col, id);
      });
    });
    main.querySelectorAll('[data-restore-trash]').forEach(btn => {
      btn.addEventListener('click', () => restoreTrashItem(btn.dataset.restoreTrash));
    });
    main.querySelectorAll('[data-purge-trash]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.data.trash = state.data.trash.filter(x => x.id !== btn.dataset.purgeTrash);
        persistData();
        showToast('已永久刪除');
      });
    });
    const btnEmptyTrash = document.getElementById('btnEmptyTrash');
    if (btnEmptyTrash) {
      btnEmptyTrash.addEventListener('click', () => {
        state.data.trash = [];
        persistData();
        showToast('已清空回收桶');
      });
    }

    // Jump tabs & Hub tags
    main.querySelectorAll('[data-jump-tab]').forEach(btn => {
      btn.addEventListener('click', () => { state.activeTab = btn.dataset.jumpTab; renderAll(); });
    });
    main.querySelectorAll('[data-hub-tag]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedHubTag = btn.dataset.hubTag;
        state.activeTab = 'hub';
        renderAll();
      });
    });
  }

  function openAiExportModal() {
    const buildSummary = (days) => {
      const cutoff = todayStr(-days);
      const diaries = state.data.diaryEntries.filter(d => days === 9999 || d.date >= cutoff);
      const learns = state.data.learningLogs.filter(l => days === 9999 || l.date >= cutoff);
      const openTodos = state.data.todos.filter(t => !t.done);
      const activeIdeas = state.data.ideas.filter(i => i.status !== '封存');
      return [
        `# 個人復盤摘要（近 ${days === 9999 ? '全部' : days + ' 天'}）`,
        '',
        '## 1. 每日日記',
        ...diaries.map(d => `- [${d.date}] 心情 ${d.mood}/5｜習慣：${(d.habits || []).join('、') || '無'}｜${d.content}`),
        '',

        '',
        '## 4. 待完成事項',
        ...openTodos.map(t => `- [${t.category}] ${t.title}（期限：${t.dueDate || '未定'}）`),
        '',
        '---',
        '請幫我根據以上紀錄：1) 總結本階段亮點與進展 2) 指出時間或注意力瓶頸 3) 建議接下來最優先推進的 3 件具體行動。'
      ].join('\n');
    };

    openModal(`

        <button id="btnCopyAi" type="button" class="btn-pill-orange px-6 py-2 text-[16px]">一鍵複製貼給 AI</button>

          <div>
            <div class="font-bold text-red-700">清空本機快取並鎖定（共用電腦防護）</div>
            <div class="text-[14px] text-red-600">登出並移除瀏覽器內暫存資料，不影響 Google Drive 雲端檔案。</div>
          </div>
          <button id="btnWipeAndLock" type="button" class="px-5 py-2 rounded-full bg-red-600 text-white font-semibold text-[15px]">清空並登出</button>
        </div>
      </div>
    `);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('btnEditOAuthInSettings').addEventListener('click', openOAuthConfigModal);
    document.getElementById('selectIdleLock').addEventListener('change', e => {
      state.idleLockMinutes = Number(e.target.value);
      safeSet(STORAGE_IDLE_KEY, state.idleLockMinutes);
      resetIdleTimer();
      showToast(state.idleLockMinutes ? `已設定閒置 ${state.idleLockMinutes} 分鐘自動鎖屏` : '已關閉自動鎖屏');
    });
    document.getElementById('btnExportJson').addEventListener('click', () => {
      downloadTextFile(`notebook_data_${todayStr(0)}.json`, JSON.stringify(state.data, null, 2), 'application/json');
      showToast('已匯出 JSON 備份');
    });
    document.getElementById('inputImportJson').addEventListener('change', e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed.diaryEntries || !parsed.todos) throw new Error('invalid');
          state.data = ensureDataShape(parsed);
          persistData();
          closeModal();
          showToast('已成功匯入 JSON 資料');
        } catch { showToast('JSON 格式不正確，請確認檔案'); }
      };
      reader.readAsText(file);
    });
    document.getElementById('btnWipeAndLock').addEventListener('click', () => {
      safeRemove(STORAGE_DATA_KEY);
      closeModal();
      lockWorkspace('已清空本機快取並鎖定');
    });
  }

  // ==================== APP LIFECYCLE ====================
  function updateOAuthBadge() {
    const b = document.getElementById('oauthStatusBadge');
    if (!b) return;
    if (state.clientId) {
      b.textContent = '已設定 Client ID';
      b.className = 'mono text-[14px] px-3 py-1 rounded-full bg-emerald-50 text-emerald-700';
    } else {
      b.textContent = '未設定 Client ID';
      b.className = 'mono text-[14px] px-3 py-1 rounded-full bg-slate-100 text-slate-700';
    }
  }

  function enterWorkspace() {
    document.getElementById('loginGate').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
    updateSyncBadge(state.mode === 'google' ? 'Drive 連線中' : '本機試用模式', state.mode === 'google' ? '#10B981' : '#FF7A00');
    resetIdleTimer();
    renderAll();
  }

  function init() {
    state.clientId = safeGet(STORAGE_CLIENT_ID_KEY, DEFAULT_GOOGLE_CLIENT_ID) || DEFAULT_GOOGLE_CLIENT_ID;
    const savedIdle = safeGet(STORAGE_IDLE_KEY, 15);
    state.idleLockMinutes = typeof savedIdle === 'number' ? savedIdle : 15;
    state.data = ensureDataShape(safeGet(STORAGE_DATA_KEY, null) || createSeedData());
    updateOAuthBadge();

    document.getElementById('btnGoogleLogin').addEventListener('click', startGoogleLogin);
    document.getElementById('btnDemoLogin').addEventListener('click', () => {
      state.mode = 'local';
      enterWorkspace();
      showToast('已進入本機試用模式（完整功能已啟用）');
    });
    document.getElementById('btnOpenOAuthConfig').addEventListener('click', openOAuthConfigModal);
    document.getElementById('btnOpenAiExport').addEventListener('click', openAiExportModal);
    document.getElementById('btnOpenSettings').addEventListener('click', openSettingsModal);
    document.getElementById('btnSyncNow').addEventListener('click', () => syncWithGoogleDrive(true));
    document.getElementById('btnPrivacyToggle').addEventListener('click', () => {
      state.privacyBlur = !state.privacyBlur;
      document.body.classList.toggle('privacy-blur', state.privacyBlur);
      showToast(state.privacyBlur ? '已開啟防窺模糊模式（滑鼠移過即顯示）' : '已關閉防窺模糊模式');
    });
    document.getElementById('btnLogout').addEventListener('click', () => lockWorkspace());

    document.getElementById('btnMobileMenu').addEventListener('click', () => {
      document.getElementById('sidebarNav').classList.toggle('hidden');
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        if (window.innerWidth < 1024) document.getElementById('sidebarNav').classList.add('hidden');
        renderAll();
      });
    });

    document.getElementById('sidebarTags').addEventListener('click', e => {
      const btn = e.target.closest('[data-hub-tag]');
      if (!btn) return;
      state.selectedHubTag = btn.dataset.hubTag;
      state.activeTab = 'hub';
      renderAll();
    });

    document.getElementById('globalSearchInput').addEventListener('input', e => {
      state.searchQuery = e.target.value;
      if (state.activeTab === 'dashboard' && state.searchQuery.trim()) state.activeTab = 'diary';
      renderAll();
    });

    document.getElementById('btnQuickVoice').addEventListener('click', () => {
      toggleVoiceInput(document.getElementById('quickCaptureInput'), document.getElementById('btnQuickVoice'));
    });

    document.getElementById('btnQuickCapture').addEventListener('click', () => {
      const type = document.getElementById('quickCaptureType').value;
      const input = document.getElementById('quickCaptureInput');
      const val = input.value.trim();
      if (!val) return;
      if (type === 'inbox') {
        state.data.inbox.unshift({ id: uid('in'), content: val, url: '', createdAt: todayStr(0), updatedAt: new Date().toISOString() });
      } else if (type === 'idea') {
        state.data.ideas.unshift({ id: uid('i'), title: val, notes: '', status: '萌芽', priority: '中', tags: ['快記'], linkedTodoId: '', updatedAt: new Date().toISOString() });
      } else if (type === 'todo') {
        state.data.todos.unshift({ id: uid('t'), title: val, category: '行動待辦', dueDate: todayStr(1), done: false, repeat: 'none', sourceIdeaId: '', tags: ['快記'], updatedAt: new Date().toISOString() });
      } else {
        state.data.diaryEntries.unshift({ id: uid('d'), date: todayStr(0), mood: 4, habits: ['寫筆記'], content: val, tags: ['快記'], attachment: null, updatedAt: new Date().toISOString() });
      }
      input.value = '';
      persistData();
      showToast('已快速記下！');
    });

    document.getElementById('modalBackdrop').addEventListener('click', e => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });
  }


  // ==================== DAILY AUTO-BACKUP SNAPSHOT (backups/YYYY-MM-DD.json) ====================
  const STORAGE_LAST_BACKUP_KEY = 'drivenote_last_backup_date';
  async function ensureDailyDriveBackup() {
    if (state.mode !== 'google' || !state.accessToken || !state.driveFolderId) return;
    const today = todayStr(0);
    if (safeGet(STORAGE_LAST_BACKUP_KEY, '') === today) return;
    try {
      const backupFolderId = await ensureDriveFolder('backups', state.driveFolderId);
      const snapName = `${today}.json`;
      const q = encodeURIComponent(`name='${snapName}' and '${backupFolderId}' in parents and trashed=false`);
      const checkRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
      const checkJson = await checkRes.json();
      if (!checkJson.files || checkJson.files.length === 0) {
        const boundary = 'drivenote_backup_boundary';
        const metadata = { name: snapName, parents: [backupFolderId], mimeType: 'application/json' };
        const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(state.data, null, 2)}\r\n--${boundary}--`;
        await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
          body
        });
      }
      safeSet(STORAGE_LAST_BACKUP_KEY, today);
    } catch {
      // Non-blocking daily snapshot
    }
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  init();
})();
</script>
</body>
</html>
